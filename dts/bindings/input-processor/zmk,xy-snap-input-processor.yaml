description: ZMK XY Snap Input Processor - iPhone-style directional lock

compatible: "zmk,xy-snap-input-processor"

"#input-processor-cells":
  type: int
  const: 0
  description: Number of cells required in the input processor specifier

properties:
  idle-timeout-ms:
    type: int
    default: 300
    description: Timeout in milliseconds after which axis lock is released when no input is detected

  switch-threshold:
    type: int
    default: 50
    description: Threshold value for switching locked axis when opposite axis movement exceeds this value

  initial-threshold:
    type: int
    default: 10
    description: Threshold value for determining initial scroll direction

  allow-axis-switch:
    type: boolean
    default: false
    description: Whether to allow axis switching during scrolling

  track-remainders:
    type: boolean
    default: true
    description: Whether to track remainder values for smooth scrolling
